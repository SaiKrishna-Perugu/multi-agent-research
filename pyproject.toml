[project]
name = "multi-agent-research"
version = "0.1.0"
description = "Multi-agent research report generator: researcher -> analyst -> writer, LangGraph orchestration with human-in-the-loop review"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-groq>=1.1",
    "langchain-google-vertexai>=3.2",
    "langchain-tavily>=0.2",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "slowapi>=0.1.9",
    "google-cloud-secret-manager>=2.30.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
extend-exclude = ["*.md"]

[tool.ruff.lint]
ignore = ["BLE001", "B008", "SIM117"]
