name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: "pyproject.toml"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run linting
      run: uv run ruff check .

    - name: Run formatting check
      run: uv run ruff format --check .

    - name: Run tests with coverage
      env:
        GROQ_API_KEY: "gsk-ci-placeholder-not-real"
        TAVILY_API_KEY: "tvly-ci-placeholder-not-real"
      run: uv run pytest tests/ -v --cov=app --cov-report=term-missing

    - name: Audit dependencies for known vulnerabilities
      run: uv run --with pip-audit pip-audit

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Build image
      run: docker build -t multi-agent-research:ci .

    - name: Smoke test the built image
      # Catches image boot failures, PermissionErrors from non-root user,
      # and verifies that config validation and graph compilation succeed on startup.
      run: |
        docker run -d --name smoke -p 8080:8080 \
          -e GROQ_API_KEY="gsk-ci-placeholder-not-real" \
          -e TAVILY_API_KEY="tvly-ci-placeholder-not-real" \
          multi-agent-research:ci
        ok=""
        for i in $(seq 1 15); do
          if curl -sf http://localhost:8080/ready; then ok=1; break; fi
          sleep 2
        done
        if [ -z "$ok" ]; then
          echo "container did not become ready in time"
          docker logs smoke
          exit 1
        fi

    - name: Container logs
      if: always()
      run: docker logs smoke || true

    - name: Clean up smoke container
      if: always()
      run: docker rm -f smoke || true
